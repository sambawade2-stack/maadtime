services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maadtime}
      POSTGRES_USER: ${POSTGRES_USER:-maadtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maadtime} -d ${POSTGRES_DB:-maadtime}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maadtime

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - maadtime

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-demosn.cloud,www.demosn.cloud,backend,localhost}
      POSTGRES_DB: ${POSTGRES_DB:-maadtime}
      POSTGRES_USER: ${POSTGRES_USER:-maadtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://demosn.cloud,https://www.demosn.cloud}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --settings=core.settings.production &&
             python manage.py collectstatic --noinput --settings=core.settings.production &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/products/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - maadtime

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://demosn.cloud/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      - backend
    networks:
      - maadtime

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maadtime-http.rule=Host(`demosn.cloud`) || Host(`www.demosn.cloud`)"
      - "traefik.http.routers.maadtime-http.entrypoints=web"
      - "traefik.http.routers.maadtime-http.middlewares=maadtime-redirect"
      - "traefik.http.middlewares.maadtime-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.maadtime-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.maadtime.rule=Host(`demosn.cloud`) || Host(`www.demosn.cloud`)"
      - "traefik.http.routers.maadtime.entrypoints=websecure"
      - "traefik.http.routers.maadtime.tls=true"
      - "traefik.http.routers.maadtime.tls.certresolver=letsencrypt"
      - "traefik.http.services.maadtime.loadbalancer.server.port=80"
    networks:
      - maadtime
      - dokploy-network

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  maadtime:
    driver: bridge
  dokploy-network:
    external: true
