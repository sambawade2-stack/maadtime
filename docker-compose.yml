services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maadtime}
      POSTGRES_USER: ${POSTGRES_USER:-maadtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # maxmemory : Redis ne dépasse jamais 100 MB.
    # allkeys-lru : supprime les clés les moins utilisées si la limite est atteinte.
    command: >
      redis-server
        --appendonly yes
        --requirepass ${REDIS_PASSWORD}
        --maxmemory 80mb
        --maxmemory-policy allkeys-lru
        --save ""
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.2'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-maadtime.com,www.maadtime.com,backend,localhost}
      POSTGRES_DB: ${POSTGRES_DB:-maadtime}
      POSTGRES_USER: ${POSTGRES_USER:-maadtime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://maadtime.com,https://www.maadtime.com}
      # Limite le tas Python pour éviter les fuites mémoire silencieuses
      MALLOC_ARENA_MAX: "2"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      - db
      - redis
    command: >
      sh -c "until python -c 'import psycopg2,os; psycopg2.connect(host=\"db\",port=5432,user=os.environ[\"POSTGRES_USER\"],password=os.environ[\"POSTGRES_PASSWORD\"],dbname=os.environ[\"POSTGRES_DB\"])' 2>/dev/null; do echo 'Waiting for DB...'; sleep 3; done &&
             python manage.py migrate --settings=core.settings.production &&
             python manage.py collectstatic --noinput --settings=core.settings.production &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.6'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://maadtime.com/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Plafonner le tas Node.js à 384 MB — sans ça Next.js peut
      # consommer 600 MB+ et déclencher l'OOM killer du VPS.
      NODE_OPTIONS: "--max-old-space-size=384"
      # Réduire la fragmentation mémoire de glibc dans Node.js
      MALLOC_ARENA_MAX: "2"
    depends_on:
      - backend
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maadtime-http.rule=Host(`maadtime.com`) || Host(`www.maadtime.com`)"
      - "traefik.http.routers.maadtime-http.entrypoints=web"
      - "traefik.http.routers.maadtime-http.middlewares=maadtime-redirect"
      - "traefik.http.middlewares.maadtime-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.maadtime-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.maadtime.rule=Host(`maadtime.com`) || Host(`www.maadtime.com`)"
      - "traefik.http.routers.maadtime.entrypoints=websecure"
      - "traefik.http.routers.maadtime.tls=true"
      - "traefik.http.routers.maadtime.tls.certresolver=letsencrypt"
      - "traefik.http.services.maadtime.loadbalancer.server.port=80"

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  dokploy-network:
    external: true
